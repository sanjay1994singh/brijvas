  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <circle cx="1320" cy="90" r="230" fill="#ffffff" opacity=".55"/>
  <circle cx="180" cy="620" r="260" fill="#0f6b52" opacity=".08"/>

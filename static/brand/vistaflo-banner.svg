<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Vistaflo banner</title>
  <desc id="desc">Original abstract website dashboard and property listing banner.</desc>
  <defs>

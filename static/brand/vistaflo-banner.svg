      <stop offset="0" stop-color="#f8fbf8"/>
      <stop offset=".55" stop-color="#e8f4ee"/>
      <stop offset="1" stop-color="#d9eadf"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f6b52"/>
      <stop offset="1" stop-color="#244e63"/>

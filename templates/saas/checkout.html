{% extends 'saas/base.html' %}{% block content %}<section class="form-card"><h1>Complete payment</h1><p>{{ order.plan.name }} · 30 days · ₹{{ order.plan.price|floatformat:2 }}</p><button class="button" id="pay">Pay securely</button><p id="payment-status" role="status"></p><form method="post" id="verification" action="{% url 'saas_payment_verify' business.slug %}">{% csrf_token %}<input type="hidden" name="razorpay_order_id"><input type="hidden" name="razorpay_payment_id"><input type="hidden" name="razorpay_signature"></form></section><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>document.getElementById('pay').onclick=function(){if(!window.Razorpay){document.getElementById('payment-status').textContent='Payment service could not load. Please retry.';return;}new Razorpay({key:'{{ key_id|escapejs }}',order_id:'{{ order.provider_order|escapejs }}',amount:{{ order.amount }},currency:'INR',name:'Property Studio',handler:function(result){const form=document.getElementById('verification');for(const key of ['razorpay_order_id','razorpay_payment_id','razorpay_signature'])form.elements[key].value=result[key];form.submit();}}).open();};</script>{% endblock %}

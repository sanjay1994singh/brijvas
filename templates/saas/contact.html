{% extends 'base.html' %}{% block content %}<section class="container py-5"><h1>Contact {{ site_setting.site_name }}</h1><div class="row my-4"><div class="col-md-5"><p>{{ site_setting.address }}</p><p>{{ site_setting.phone }}</p><a href="mailto:{{ site_setting.email }}">{{ site_setting.email }}</a></div><div class="col-md-7"><form method="post">{% csrf_token %}<label class="form-label" for="name">Name</label><input class="form-control mb-3" id="name" name="name" maxlength="200" required><label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" required><label class="form-label" for="phone">Phone</label><input class="form-control mb-3" id="phone" name="phone" maxlength="20"><label class="form-label" for="subject">Subject</label><input class="form-control mb-3" id="subject" name="subject" maxlength="255"><label class="form-label" for="message">Message</label><textarea class="form-control mb-3" id="message" name="message" maxlength="5000" required></textarea><button class="btn btn-primary">Send enquiry</button></form></div></div></section>{% endblock %}

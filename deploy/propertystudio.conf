<VirtualHost *:80>
    ServerName vistaflo.live-app.in
    Alias /.well-known/acme-challenge/ /var/www/brijvas-saas/acme/.well-known/acme-challenge/
    <Directory /var/www/brijvas-saas/acme>
        Require all granted
        Options -Indexes
    </Directory>
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://vistaflo.live-app.in%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName brijvas.com
    ServerAlias www.brijvas.com
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/brijvas.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/brijvas.com/privkey.pem

    RewriteEngine on
    RewriteCond /var/www/brijvas-saas/maintenance.flag -f
    RewriteRule ^ - [R=503,L]
    ErrorDocument 503 "Brijvas is completing a scheduled update. Please retry shortly."

    Alias /static/ /var/www/brijvas-saas/staticfiles/
    <Directory /var/www/brijvas-saas/staticfiles>
        Require all granted
        Options -Indexes -ExecCGI
    </Directory>
    Alias /media/ /var/www/brijvas-saas/media/
    <Directory /var/www/brijvas-saas/media>
        Require all granted
        Options -Indexes -ExecCGI
        <FilesMatch "\.(php|cgi|pl|py|sh|html|htm|svg)$">
            Require all denied
        </FilesMatch>
    </Directory>
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass / http://127.0.0.1:8012/ connectiontimeout=5 timeout=90
    ProxyPassReverse / http://127.0.0.1:8012/
    ErrorLog ${APACHE_LOG_DIR}/brijvas-saas-error.log
    CustomLog ${APACHE_LOG_DIR}/brijvas-saas-access.log combined
</VirtualHost>
</IfModule>
